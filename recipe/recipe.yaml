schema_version: 1

context:
  name: stamina
  version: 26.2.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/stamina-${{ version }}.tar.gz
  sha256: c81efa445d6cd6f898584faa7556df09f6e4d25c16e219914b6422eeb3372985

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-vcs
    - hatch-fancy-pypi-readme >=22.8.0
  run:
    - python >=${{ python_min }}
    - tenacity >=8.3.0
tests:
  - python:
      imports:
        - stamina
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Production-grade retries made easy.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/hynek/stamina
  repository: https://github.com/hynek/stamina
  documentation: https://stamina.hynek.me/en/stable/

extra:
  recipe-maintainers:
    - xylar
